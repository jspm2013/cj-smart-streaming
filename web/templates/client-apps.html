{% extends "base.html" %} {% block title %}Client Apps{% endblock %} {% block
content %}
<h2 class="text-xl font-bold mb-4">Client Apps (JWT Issuers)</h2>

<form
  method="post"
  action="/admin/client-apps"
  class="flex flex-col md:flex-row gap-2 max-w-2xl"
>
  <input
    name="name"
    class="input input-bordered w-full"
    placeholder="my-nextjs-app"
    required
  />
  <input
    name="api_key"
    class="input input-bordered w-full"
    placeholder="plain API key to hash & store"
    required
  />
  <button class="btn btn-primary">Add</button>
</form>

<div class="card bg-base-100 shadow mt-6">
  <div class="card-body">
    <div class="overflow-x-auto">
      <table class="table table-sm">
        <thead class="bg-base-200">
          <tr>
            <th>Name</th>
            <th>Active</th>
            <th class="text-right pr-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for a in apps %}
          <tr>
            <td class="text-sm"><code>{{ a.name }}</code></td>
            <td>
              {% if a.active %}<span class="badge badge-success">Yes</span>{%
              else %}<span class="badge">No</span>{% endif %}
            </td>
            <td class="text-right pr-4">
              <form
                method="post"
                action="/admin/client-apps/{{ a.id }}/toggle"
                class="inline"
              >
                <button class="btn btn-xs btn-outline">Toggle</button>
              </form>
              <form
                method="post"
                action="/admin/client-apps/{{ a.id }}/delete"
                class="inline"
                onsubmit="return confirm('Delete?')"
              >
                <button class="btn btn-xs btn-error">Delete</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="3" class="text-center py-6 opacity-70">
              No client apps yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
